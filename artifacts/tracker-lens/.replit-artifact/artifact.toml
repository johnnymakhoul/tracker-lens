kind = "web"
previewPath = "/"
title = "Tracker Lens"
description = "A privacy-focused browser extension that reveals the actual data websites expose to third-party request destinations, including cookies, query parameters, referrers, and page context."
version = "1.0.0"
id = "artifacts/tracker-lens"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19971

[services.development]
run = "pnpm --filter @workspace/tracker-lens run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tracker-lens", "run", "build" ]
serve = "static"
publicDir = "artifacts/tracker-lens/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19971"
BASE_PATH = "/"
